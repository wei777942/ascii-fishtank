<!doctype html>
<html lang="zh-Hant">
<head>
<script>/* v10: ?can=ROOM opens the phone food-can screen instead of the tank (never touches the tank save) */
if (/[?&]can=/.test(location.search)) location.replace('can.html' + location.search);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="電子魚缸">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>電子魚缸</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;position:fixed;inset:0;width:100%}
  canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .ui{font-family:ui-monospace,Menlo,"SF Mono",monospace,-apple-system,"PingFang TC",sans-serif}
  #bar{position:fixed;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 50px);display:flex;flex-direction:column;align-items:stretch;gap:6px;
    min-width:150px;padding:8px;background:rgba(0,10,12,.92);border:1px solid rgba(57,246,255,.35);border-radius:16px;z-index:5}
  #bar button{min-height:44px;padding:8px 14px;text-align:left;font-size:15px}
  #bar #bTilt{position:static;font-size:14px;opacity:1}
  button{pointer-events:auto;background:rgba(0,20,22,.55);color:#7ffcff;border:1px solid rgba(57,246,255,.45);border-radius:14px;
    font:600 14px ui-monospace,Menlo,monospace,-apple-system,"PingFang TC",sans-serif;padding:9px 9px;min-width:0;
    touch-action:manipulation;-webkit-appearance:none}
  button:active{background:rgba(57,246,255,.22)}
  button.need{color:#bfffd0;border-color:#46ff8c;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{background:rgba(70,255,140,.28)}}
  #ebar{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:none;flex-direction:column;align-items:center;gap:7px;pointer-events:none;
    padding:0 calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px)}
  .erow{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;pointer-events:none}
  #eSel{display:none;background:rgba(0,14,16,.85);border:1px solid rgba(255,224,102,.5);border-radius:14px;padding:6px 8px;pointer-events:auto;color:#ffe9a0;font-size:13px}
  #eSel button{padding:6px 9px;font-size:13px}
  #eSel .lbl{padding:0 4px;white-space:nowrap}
  #eSel .num{min-width:22px;text-align:center;color:#fff}
  #eSel .sep{width:4px}
  #eSel button.del{color:#ffb0b0;border-color:rgba(255,120,120,.6);}
  #ePalC button,#ePalD button{padding:6px 8px;font-size:13px}
  #ePalC button.art{min-width:74px;min-height:52px;padding:6px 8px;display:flex;align-items:center;justify-content:center}
  #ePalC button.art pre{margin:0;font:600 12px/1.05 ui-monospace,Menlo,monospace;pointer-events:none}
  #eCount{font-size:11px;opacity:.75}
  #ebar button.sel,#eSel button.sel{background:rgba(70,255,140,.22);border-color:#46ff8c;color:#d8ffe4;}
  #eTrash{min-width:56px;font-size:18px;padding:6px 10px}
  #eTrash.hot{background:rgba(255,70,70,.35);border-color:#ff6a6a;}
  #eDone{color:#bfffd0;border-color:#46ff8c}
  body.editing #toast{top:46%}
  #bTilt{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 56px);font-size:12px;padding:6px 10px;min-width:0;display:none;opacity:.8}
  #bTilt.on{color:#bfffd0;border-color:#46ff8c;opacity:1}
  #bMenu{position:fixed;top:calc(env(safe-area-inset-top) + 4px);right:calc(env(safe-area-inset-right) + 10px);font-size:18px;line-height:1;width:44px;height:44px;padding:0;min-width:0;opacity:.55}
  body.menu #bMenu{opacity:1;color:#bfffd0;border-color:#46ff8c}
  body.editing #bMenu{display:none}
  body:not(.menu) #bar,body:not(.menu) #bTilt{display:none!important}
  #panel{position:fixed;left:calc(env(safe-area-inset-left) + 14px);right:calc(env(safe-area-inset-right) + 14px);
    top:calc(env(safe-area-inset-top) + 52px);background:rgba(0,10,12,.86);border:1px solid rgba(57,246,255,.4);border-radius:16px;
    color:#aefcff;padding:14px 14px 10px;font-size:13px;line-height:1.55;display:none;white-space:pre;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;max-height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 130px);box-sizing:border-box}
  #panel b{color:#46ff8c;font-weight:600}
  #canPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,88vw);display:none;z-index:20;text-align:center;
    background:rgba(0,10,12,.96);border:1px solid rgba(57,246,255,.45);border-radius:18px;padding:16px 14px 14px;color:#aefcff;font-size:13px;line-height:1.5;box-sizing:border-box}
  #canPanel .ct{font-size:16px;font-weight:600;color:#bfffd0;margin-bottom:10px}
  #canPanel canvas{position:static;display:block;margin:0 auto 10px;width:200px;height:200px;background:#fff;border-radius:6px;image-rendering:pixelated}
  #canPanel .code b{font-size:20px;letter-spacing:3px;color:#ffe066}
  #canPanel .lnk{font-size:11px;color:#4f9aa0;word-break:break-all;margin:4px 0 8px}
  #canPanel #canStatus{margin:6px 0 10px;color:#7ffcff}
  #canPanel #canStatus.ok{color:#46ff8c}
  #canPanel .cr{display:flex;gap:8px;justify-content:center}
  #canPanel .cr button{min-height:40px;padding:6px 14px}
  #canLive{color:#46ff8c;display:none}
  #canLive.on{display:inline}
  #panel .dim{color:#4f9aa0}
  #panel .ptog{display:flex;flex-wrap:wrap;gap:6px;white-space:normal;margin-bottom:8px}
  #pAuto,#pSound,#pBreed{font-size:13px;padding:6px 12px;min-width:0;margin:0}
  #pAuto.on,#pSound.on,#pBreed.on{color:#bfffd0;border-color:#46ff8c;background:rgba(70,255,140,.18)}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);color:#bfffd0;
    font-size:13px;background:rgba(0,16,10,.75);border:1px solid rgba(70,255,140,.4);border-radius:12px;padding:6px 12px;
    opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="bar" class="ui">
  <button id="bFeed">∴ 餵食</button>
  <button id="bWater">≈ 換水</button>
  <button id="bInfo">♡ 狀態</button>
  <button id="bStyle">▦ 像素</button>
  <button id="bDecor">⌂ 佈置</button>
  <button id="bCan">⇄ 手機飼料罐<span id="canLive"> ●</span></button>
  <button id="bTilt" class="ui">📱 傾斜：關</button>
</div>
<div id="ebar" class="ui">
  <div class="erow">
    <button id="eTabD">⌂ 裝飾</button>
    <button id="eTabC">∽ 生物 <span id="eCount"></span></button>
    <button id="eDone">完成</button>
  </div>
  <div id="ePalD" class="erow">
    <button id="eTrash">🗑</button>
  </div>
  <div id="ePalC" class="erow wrap"></div>
  <div id="eSel" class="erow"></div>
</div>
<button id="bMenu" class="ui" aria-label="選單">≡</button>
<div id="panel" class="ui"></div>
<div id="canPanel" class="ui"></div>
<div id="toast" class="ui"></div>
<script>if (!/[?&]can=/.test(location.search)) document.write('<script src="app.js?v=10"><\/script>');</script>
</body>
</html>
